name: update
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Bump nixpkgs on Mondays
        run: if [ "$(date -u +%u)" = 1 ]; then nix flake update; fi
      - name: Update apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update.py > update.log \
            || echo "::warning::some apps failed to update; they keep their old version and are retried next run"
          cat update.log
      - name: Collect changes
        id: diff
        run: |
          git diff --binary -- apps.json flake.lock > update.patch
          if [ -s update.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update
          path: |
            update.patch
            update.log

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: update
      - run: git apply update.patch
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  # Pushing straight to main needs no repository setting. Opening a PR from
  # a workflow does ("Allow GitHub Actions to create and approve pull
  # requests"), and that setting is off by default.
  push:
    needs: [update, check]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: update
      - name: Commit and push
        run: |
          git apply update.patch
          if git diff --quiet -- apps.json; then
            title="chore: bump nixpkgs"
          else
            title="chore: update Craft apps"
          fi
          { echo "$title"; echo; cat update.log; } > commit-message.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json flake.lock
          git commit -F commit-message.txt
          git push
